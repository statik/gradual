<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Agent Demo</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="dot"></span>
      <strong>Pi Agent Demo</strong>
    </div>
    <div class="topbar__right">
      <select id="model-select" aria-label="Model">
        <option value="gpt-4o-mini" selected>gpt-4o-mini</option>
        <option value="gpt-4o">gpt-4o</option>
        <option value="claude-3-5-haiku-latest">claude-3-5-haiku</option>
        <option value="claude-3-5-sonnet-latest">claude-3-5-sonnet</option>
      </select>
      <div class="quota" title="Daily token budget">
        <div class="quota__bar"><div id="quota-fill"></div></div>
        <span id="quota-text">— / —</span>
      </div>
      <div id="user-pill" class="pill">…</div>
    </div>
  </header>

  <main class="layout">
    <section id="transcript" class="transcript">
      <article class="msg msg--system">
        <header class="msg__role">system</header>
        <div class="msg__content">
          Ask the agent to do something — it can run Python via the <code>python_run</code> tool. Each cell waits for you to Run or Skip.
        </div>
      </article>
    </section>
  </main>

  <footer class="composer">
    <form id="composer-form">
      <textarea id="composer-input" rows="2" placeholder="e.g. compute the first 20 fibonacci numbers and plot them" required></textarea>
      <button type="submit" id="composer-submit">Send</button>
    </form>
    <div class="composer__hints">
      <kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for newline
    </div>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
